name: Controlled stable release archive

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable semantic version matching the selected v-tag
        required: true
        type: string
      source_date_epoch:
        description: Reproducible build epoch in Unix seconds
        required: true
        type: string
      confirmation:
        description: Type STABLE RELEASE exactly
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  TZ: UTC
  UV_DEFAULT_INDEX: https://pypi.org/simple
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_EPOCH: ${{ inputs.source_date_epoch }}
  RELEASE_CONFIRMATION: ${{ inputs.confirmation }}

jobs:
  stable:
    name: Build protected stable archive
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: stable-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out immutable revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Provision Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Provision reviewed uv toolchain
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.10.0'
          enable-cache: true
          cache-dependency-glob: uv.lock
          download-from-astral-mirror: false
      - name: Validate tag-bound invocation
        run: |
          python - <<'PY'
          import os
          import re
          import sys
          version = os.environ['RELEASE_VERSION']
          epoch = os.environ['RELEASE_EPOCH']
          confirmation = os.environ['RELEASE_CONFIRMATION']
          ref = os.environ['GITHUB_REF']
          if confirmation != 'STABLE RELEASE':
              sys.exit('confirmation phrase mismatch')
          if not re.fullmatch(r'[1-9]\d*\.\d+\.\d+', version):
              sys.exit('version must be a stable v1+ semantic version')
          if ref != f'refs/tags/v{version}':
              sys.exit('selected ref does not match the requested release version')
          if not epoch.isdigit() or int(epoch) < 315532800:
              sys.exit('source_date_epoch is invalid')
          PY
      - name: Synchronize locked development environment
        run: uv sync --frozen --extra dev
      - name: Run complete quality harness
        run: uv run make check
      - name: Build stable archive twice and require byte identity
        run: |
          rm -rf build/stable-first build/stable-second build/stable
          uv run python -m gfjd release build --version "$RELEASE_VERSION" --output build/stable-first --source-date-epoch "$RELEASE_EPOCH" --allow-version-override
          uv run python -m gfjd release build --version "$RELEASE_VERSION" --output build/stable-second --source-date-epoch "$RELEASE_EPOCH" --allow-version-override
          uv run python -m gfjd release verify "build/stable-first/gfjd-$RELEASE_VERSION"
          uv run python -m gfjd release verify "build/stable-second/gfjd-$RELEASE_VERSION"
          uv run python -m gfjd harness repro "build/stable-first/gfjd-$RELEASE_VERSION.zip" "build/stable-second/gfjd-$RELEASE_VERSION.zip"
          mkdir -p build/stable
          cp "build/stable-first/gfjd-$RELEASE_VERSION.zip" build/stable/gfjd-stable-release.zip
      - name: Attest verified stable archive
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: build/stable/gfjd-stable-release.zip
      - name: Upload stable archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: controlled-stable-release
          path: build/stable/gfjd-stable-release.zip
          if-no-files-found: error
          retention-days: 90
