name: Quality and release rehearsal

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src tests
      - run: python -m gfjd validate --strict
      - run: python -m gfjd security
      - run: python -m pytest --cov=gfjd --cov-report=term-missing --cov-branch
      - run: python -m gfjd conductor check-generated

  release-rehearsal:
    runs-on: ubuntu-latest
    needs: test
    env:
      SOURCE_DATE_EPOCH: '1784419200'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m gfjd release build --version 0.3.0-rehearsal --output build/rehearsal --source-date-epoch "$SOURCE_DATE_EPOCH" --allow-version-override
      - run: python -m gfjd release verify build/rehearsal/gfjd-0.3.0-rehearsal
      - uses: actions/upload-artifact@v4
        with:
          name: release-rehearsal
          path: build/rehearsal/gfjd-0.3.0-rehearsal.zip
          retention-days: 14
