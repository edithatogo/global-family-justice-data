name: Quality harness

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  SOURCE_DATE_EPOCH: '1785542400'
  TZ: UTC
  UV_DEFAULT_INDEX: https://pypi.org/simple

jobs:
  static:
    name: Static contracts and repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out immutable revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Provision Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Provision reviewed uv toolchain
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.10.0'
          enable-cache: true
          cache-dependency-glob: uv.lock
          download-from-astral-mirror: false
      - name: Synchronize locked development environment
        run: uv sync --frozen --extra dev
      - name: Compile
        run: uv run python -m compileall -q src tests scripts
      - name: Format
        run: uv run python -m ruff format --check src tests scripts
      - name: Lint
        run: uv run python -m ruff check src tests scripts
      - name: Type check
        run: uv run python -m mypy src
      - name: Audit workflow policy
        run: uv run python -m gfjd policy ci
      - name: Audit repository-control declaration
        run: uv run python -m gfjd policy repository
      - name: Audit dependency lock
        run: uv run python -m gfjd harness lock
      - name: Verify public-contract lock
        run: uv run python -m gfjd harness contracts
      - name: Validate repository
        run: uv run python -m gfjd validate --as-of 2026-07-27
      - name: Scan public boundary
        run: uv run python -m gfjd security
      - name: Verify generated programme views
        run: uv run python -m gfjd conductor check-generated
      - name: Verify source manifest
        run: uv run python -m gfjd manifest --verify
      - name: Diagnose handoff
        run: uv run python -m gfjd doctor

  unit:
    name: Unit tests / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Check out immutable revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Provision Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Provision reviewed uv toolchain
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.10.0'
          enable-cache: true
          cache-dependency-glob: uv.lock
          download-from-astral-mirror: false
      - name: Synchronize locked development environment
        run: uv sync --frozen --extra dev
      - name: Run unit tier
        env:
          GFJD_TEST_TIMINGS: build/test-timings-unit.json
        run: uv run pytest -q -m "unit and not slow" --junitxml=build/junit-unit.xml
      - name: Enforce unit runtime budgets
        run: uv run python -m gfjd harness runtime build/test-timings-unit.json --suite unit
      - name: Upload unit receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-python-${{ matrix.python }}
          path: |
            build/junit-unit.xml
            build/test-timings-unit.json
          if-no-files-found: error
          retention-days: 14

  property:
    name: Property and adversarial tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out immutable revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Provision Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Provision reviewed uv toolchain
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.10.0'
          enable-cache: true
          cache-dependency-glob: uv.lock
          download-from-astral-mirror: false
      - name: Synchronize locked development environment
        run: uv sync --frozen --extra dev
      - name: Run adversarial tier
        env:
          GFJD_TEST_TIMINGS: build/test-timings-property.json
          HYPOTHESIS_PROFILE: ci
        run: uv run pytest -q -m "property and not slow" --junitxml=build/junit-property.xml
      - name: Enforce adversarial runtime budget
        run: uv run python -m gfjd harness runtime build/test-timings-property.json --suite unit
      - name: Upload adversarial receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: property-receipts
          path: |
            build/junit-property.xml
            build/test-timings-property.json
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: Branch coverage and quality budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out immutable revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Provision Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Provision reviewed uv toolchain
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.10.0'
          enable-cache: true
          cache-dependency-glob: uv.lock
          download-from-astral-mirror: false
      - name: Synchronize locked development environment
        run: uv sync --frozen --extra dev
      - name: Run branch-aware suite
        env:
          GFJD_TEST_TIMINGS: build/test-timings-coverage.json
        run: >-
          uv run pytest -q -m "not slow"
          --cov=gfjd --cov-branch
          --cov-report=term-missing
          --cov-report=json:build/coverage.json
          --junitxml=build/junit-coverage.xml
      - name: Enforce coverage budgets
        run: uv run python -m gfjd harness coverage build/coverage.json
      - name: Upload coverage receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: branch-coverage
          path: |
            build/coverage.json
            build/junit-coverage.xml
            build/test-timings-coverage.json
          if-no-files-found: error
          retention-days: 30

  integration:
    name: Integration and failure-boundary rehearsals
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Check out immutable revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Provision Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Provision reviewed uv toolchain
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.10.0'
          enable-cache: true
          cache-dependency-glob: uv.lock
          download-from-astral-mirror: false
      - name: Synchronize locked development environment
        run: uv sync --frozen --extra dev
      - name: Run integration tier
        env:
          GFJD_TEST_TIMINGS: build/test-timings-integration.json
        run: uv run pytest -q -m "integration and not slow" --junitxml=build/junit-integration.xml
      - name: Enforce integration runtime budgets
        run: uv run python -m gfjd harness runtime build/test-timings-integration.json --suite integration
      - name: Run end-to-end rehearsals
        run: uv run make integration-rehearsals
      - name: Upload integration receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-receipts
          path: |
            build/junit-integration.xml
            build/test-timings-integration.json
            build/demo
            build/evidence
            build/comparability
            build/warehouse
            build/backup
            build/restore-rehearsal
            build/bootstrap-rehearsal
            build/rehearsal
          if-no-files-found: error
          retention-days: 14

  platform-smoke:
    name: Platform smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Check out immutable revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Provision Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Provision reviewed uv toolchain
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.10.0'
          enable-cache: true
          cache-dependency-glob: uv.lock
          download-from-astral-mirror: false
      - name: Synchronize locked development environment
        run: uv sync --frozen --extra dev
      - name: Run cross-platform smoke
        run: |
          uv run python -m gfjd version --json
          uv run pytest -q tests/test_cli.py tests/test_schema_contracts.py

  package:
    name: Build and install distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out immutable revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Provision Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Provision reviewed uv toolchain
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.10.0'
          enable-cache: true
          cache-dependency-glob: uv.lock
          download-from-astral-mirror: false
      - name: Synchronize locked development environment
        run: uv sync --frozen --extra dev
      - name: Build source and wheel distributions
        run: uv run python scripts/build_distribution.py --wheel --sdist --outdir dist
      - name: Inspect distributions
        run: |
          uv run python -m gfjd harness wheel dist/*.whl
          uv run python -m gfjd harness sdist dist/*.tar.gz
      - name: Require deterministic wheels
        run: uv run make package-reproducibility
      - name: Install wheel with declared runtime dependencies
        run: |
          python -m venv build/wheel-smoke
          build/wheel-smoke/bin/python -m pip install --disable-pip-version-check dist/*.whl
          build/wheel-smoke/bin/gfjd version --json
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release-reproducibility:
    name: Deterministic release double-build
    needs: [static, unit, property, coverage, integration, platform-smoke, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out immutable revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Provision Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Provision reviewed uv toolchain
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.10.0'
          enable-cache: true
          cache-dependency-glob: uv.lock
          download-from-astral-mirror: false
      - name: Synchronize locked development environment
        run: uv sync --frozen --extra dev
      - name: Build and compare two release bundles
        run: uv run make release-reproducibility
      - name: Upload verified rehearsal release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-rehearsal
          path: build/repro-first/gfjd-0.6.0-alpha.2-rehearsal.zip
          if-no-files-found: error
          retention-days: 30
