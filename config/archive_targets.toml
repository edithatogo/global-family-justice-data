[archive]
schema_version = "1.0"
policy = "fail_closed"
description = "Public remote custody, medallion publication and byte-level safety boundary for reproducible GFJD archival exports."
github_repository = "edithatogo/global-family-justice-data"
github_branch = "main"
github_release_mode = "release-candidate-then-stable"
minimum_publish_gate = "G6"
authoritative_custody = "public_remote_only"
local_staging_policy = "ephemeral_until_two_public_receipts_verify"
minimum_provider_separated_public_replicas = 2

[huggingface]
namespace = "edithatogo"
targets_are_provisional = false
private_by_default = false
publication_mode = "public_medallion"
requires_exact_repository_approval = false
minimum_publish_gate = "G3"

[[huggingface.targets]]
id = "source-archive"
repository = "gfjd-source-archive"
repo_type = "dataset"
payload_policy = "public_safe_exact_editions_and_capture_objects"
minimum_publish_gate = "G3"

[[huggingface.targets]]
id = "source-catalogue"
repository = "gfjd-source-catalogue"
repo_type = "dataset"
payload_policy = "metadata_and_cleared_bytes_only"
minimum_publish_gate = "G3"

[[huggingface.targets]]
id = "observations"
repository = "gfjd-observations"
repo_type = "dataset"
payload_policy = "generated_observations_only"
minimum_publish_gate = "G4"

[[huggingface.targets]]
id = "outcomes-evidence"
repository = "gfjd-outcomes-evidence"
repo_type = "dataset"
payload_policy = "generated_evidence_only"
minimum_publish_gate = "G4"

[[huggingface.targets]]
id = "extraction-benchmark"
repository = "gfjd-extraction-benchmark"
repo_type = "dataset"
payload_policy = "synthetic_or_cleared_only"
minimum_publish_gate = "G4"

[[huggingface.targets]]
id = "explorer"
repository = "gfjd-explorer"
repo_type = "space"
payload_policy = "generated_products_only"
minimum_publish_gate = "G6"

[rights]
unknown = "retain_metadata_and_citation_receipt_only"
restricted_or_unknown = "retain_metadata_and_citation_receipt_only"
open_licence_verified = "bytes_allowed_only_for_exact_edition_and_manifest"
public_domain = "bytes_allowed_when_edition_and_provenance_are_bound"

[controls]
require_source_manifest = true
require_sha256 = true
require_edition_bound_rights = true
require_generated_product_lineage = true
require_release_gate_acceptance = true
require_published_receipt = true
never_upload_unresolved_rights = false
rights_state_is_public_metadata = true
require_prohibited_data_scan = true
require_secret_scan = true
require_two_provider_separated_public_receipts = true
require_anonymous_restore = true
forbid_durable_local_only_objects = true
