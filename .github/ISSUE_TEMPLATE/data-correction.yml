name: Report a data or methods correction
about: Report an extraction, definition, lineage or comparability problem
labels: ['correction', 'triage']
body:
  - type: input
    id: release
    attributes:
      label: Affected release or source
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and impact
      description: Explain the suspected error and any affected interpretation.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Provide source title, locator and reproduction steps. Do not include personal case information.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I have not included identifiable, sealed or restricted case material.
          required: true
