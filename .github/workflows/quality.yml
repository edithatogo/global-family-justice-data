name: Quality harness

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  SOURCE_DATE_EPOCH: '1784419200'
  TZ: UTC
  UV_DEFAULT_INDEX: https://pypi.org/simple

jobs:
  static:
    name: Static contracts and repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out immutable revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Provision Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Provision reviewed uv toolchain
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.10.0'
          enable-cache: true
          cache-dependency-glob: uv.lock
          download-from-astral-mirror: false
      - name: Synchronize locked development environment
        run: uv sync --frozen --extra dev
      - name: Compile
        run: uv run python -m compileall -q src tests
      - name: Format
        run: uv run python -m ruff format --check src tests
      - name: Lint
        run: uv run python -m ruff check src tests
      - name: Type check
        run: uv run python -m mypy src
      - name: Audit GitHub Actions policy
        run: uv run python -m gfjd policy ci
      - name: Audit repository-control baseline
        run: uv run python -m gfjd policy repository
      - name: Audit dependency lock
        run: uv run python -m gfjd harness lock
      - name: Verify public-contract lock
        run: uv run python -m gfjd harness contracts
      - name: Diagnose repository
        run: uv run python -m gfjd doctor
      - name: Validate contracts and aggregate boundary
        run: uv run python -m gfjd validate --as-of 2026-07-19
      - name: Scan repository
        run: uv run python -m gfjd security
      - name: Verify generated conductor views
        run: uv run python -m gfjd conductor check-generated
      - name: Verify repository manifest
        run: uv run python -m gfjd manifest --verify

  unit:
    name: Unit tests / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Check out immutable revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Provision Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Provision reviewed uv toolchain
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.10.0'
          enable-cache: true
          cache-dependency-glob: uv.lock
          download-from-astral-mirror: false
      - name: Synchronize locked development environment
        run: uv sync --frozen --extra dev
      - name: Run deterministic unit suite
        env:
          GFJD_TEST_TIMINGS: build/test-timings-unit.json
        run: uv run pytest -m "unit and not property and not slow" -n auto --dist loadscope --junitxml=build/junit-unit.xml
      - name: Enforce unit runtime budgets
        run: uv run python -m gfjd harness runtime build/test-timings-unit*.json --suite unit
      - name: Upload unit receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-python-${{ matrix.python }}
          path: |
            build/junit-unit.xml
            build/test-timings-unit*.json
          if-no-files-found: error
          retention-days: 14

  property:
    name: Property and adversarial tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out immutable revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Provision Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Provision reviewed uv toolchain
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.10.0'
          enable-cache: true
          cache-dependency-glob: uv.lock
          download-from-astral-mirror: false
      - name: Synchronize locked development environment
        run: uv sync --frozen --extra dev
      - name: Run deterministic property suite
        env:
          GFJD_TEST_TIMINGS: build/test-timings-property.json
          HYPOTHESIS_PROFILE: ci
        run: uv run pytest -m "property and not slow" --junitxml=build/junit-property.xml
      - name: Enforce property runtime budget
        run: uv run python -m gfjd harness runtime build/test-timings-property.json --suite unit
      - name: Upload property receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: property-receipts
          path: |
            build/junit-property.xml
            build/test-timings-property.json
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: Branch coverage and quality budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out immutable revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Provision Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Provision reviewed uv toolchain
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.10.0'
          enable-cache: true
          cache-dependency-glob: uv.lock
          download-from-astral-mirror: false
      - name: Synchronize locked development environment
        run: uv sync --frozen --extra dev
      - name: Run branch-aware complete suite
        env:
          GFJD_TEST_TIMINGS: build/test-timings-coverage.json
        run: >-
          uv run pytest -m "not slow"
          --cov=gfjd --cov-branch
          --cov-report=term-missing
          --cov-report=json:build/coverage.json
          --junitxml=build/junit-coverage.xml
      - name: Enforce coverage ratchet and critical-module budgets
        run: uv run python -m gfjd harness coverage build/coverage.json
      - name: Upload coverage receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: branch-coverage
          path: |
            build/coverage.json
            build/junit-coverage.xml
            build/test-timings-coverage.json
          if-no-files-found: error
          retention-days: 30

  integration:
    name: Integration and failure-boundary rehearsals
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out immutable revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Provision Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Provision reviewed uv toolchain
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.10.0'
          enable-cache: true
          cache-dependency-glob: uv.lock
          download-from-astral-mirror: false
      - name: Synchronize locked development environment
        run: uv sync --frozen --extra dev
      - name: Run integration tests
        env:
          GFJD_TEST_TIMINGS: build/test-timings-integration.json
        run: uv run pytest -m "integration and not slow" --junitxml=build/junit-integration.xml
      - name: Enforce integration runtime budgets
        run: uv run python -m gfjd harness runtime build/test-timings-integration*.json --suite integration
      - name: Run product and resilience rehearsals
        run: uv run make integration-rehearsals
      - name: Upload integration receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-receipts
          path: |
            build/junit-integration.xml
            build/test-timings-integration*.json
            build/catalogue-rehearsal
            build/evidence
            build/comparability
            build/gate-packs
            build/demo
            build/warehouse
            build/products
            build/workflow-runs
            build/backup
            build/restore-rehearsal
          if-no-files-found: error
          retention-days: 14

  platform-smoke:
    name: Platform smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Check out immutable revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Provision Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Provision reviewed uv toolchain
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.10.0'
          enable-cache: true
          cache-dependency-glob: uv.lock
          download-from-astral-mirror: false
      - name: Synchronize locked development environment
        run: uv sync --frozen --extra dev
      - name: Run cross-platform smoke tests
        run: |
          uv run python -m gfjd version --json
          uv run pytest -q tests/test_cli.py tests/test_schema_contracts.py -m "not integration"

  package:
    name: Build and install distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out immutable revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Provision Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Provision reviewed uv toolchain
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.10.0'
          enable-cache: true
          cache-dependency-glob: uv.lock
          download-from-astral-mirror: false
      - name: Synchronize locked development environment
        run: uv sync --frozen --extra dev
      - name: Build source and wheel distributions from locked backend
        run: uv run python -m build --no-isolation
      - name: Inspect distribution contents and integrity
        run: |
          uv run python -m gfjd harness wheel dist/*.whl
          uv run python -m gfjd harness sdist dist/*.tar.gz
      - name: Rebuild wheel and require byte identity
        run: uv run make package-reproducibility
      - name: Install wheel in a clean virtual environment
        run: |
          python -m venv build/wheel-smoke
          build/wheel-smoke/bin/python -m pip install --disable-pip-version-check dist/*.whl
          build/wheel-smoke/bin/gfjd version --json
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release-reproducibility:
    name: Deterministic release double-build
    needs: [static, unit, property, coverage, integration, platform-smoke, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Check out immutable revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Provision Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Provision reviewed uv toolchain
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.10.0'
          enable-cache: true
          cache-dependency-glob: uv.lock
          download-from-astral-mirror: false
      - name: Synchronize locked development environment
        run: uv sync --frozen --extra dev
      - name: Build and compare two release bundles
        run: uv run make release-reproducibility
      - name: Upload verified rehearsal release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-rehearsal
          path: build/repro-first/gfjd-0.4.0-alpha.3-rehearsal.zip
          if-no-files-found: error
          retention-days: 30
