name: Data or source correction
about: Report a possible error in metadata, extraction, mapping or released interpretation
title: "[Correction]: "
labels: [correction, needs-triage]
body:
  - type: markdown
    attributes:
      value: Do not include personal case information, sealed material, credentials or sensitive security details.
  - type: input
    id: release
    attributes:
      label: Affected release or branch
      placeholder: e.g. v1.0.0 or main
    validations:
      required: true
  - type: input
    id: entity
    attributes:
      label: Affected jurisdiction, source, indicator or observation ID
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What appears to be wrong?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Source evidence and exact locator
      description: Include URL and page/table/sheet/cell/query/filter where applicable.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Potential impact
      options:
        - Metadata or wording only
        - Value or provenance
        - Matter/indicator classification
        - Comparability or interpretation
        - Privacy, legal or security concern
    validations:
      required: true
