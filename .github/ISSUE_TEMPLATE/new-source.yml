name: New or updated source
description: Propose an official, research, or outcomes-evidence source
title: "[SOURCE] "
labels: ["source", "needs-triage"]
body:
  - type: input
    id: jurisdiction
    attributes:
      label: Jurisdiction ID
      description: Use the registry ID or propose one if the jurisdiction is not yet represented.
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Source title
    validations:
      required: true
  - type: input
    id: publisher
    attributes:
      label: Publisher or responsible institution
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Canonical URL
    validations:
      required: true
  - type: input
    id: verified
    attributes:
      label: Date verified (YYYY-MM-DD)
    validations:
      required: true
  - type: textarea
    id: coverage
    attributes:
      label: Coverage and measures/outcomes
      description: Include matter types, years, geography, measures or outcome domains, and source format.
    validations:
      required: true
  - type: textarea
    id: retrieval
    attributes:
      label: Retrieval details and exact provenance
      description: Include file/table/page, dashboard filters, API parameters, or spreadsheet locations.
  - type: textarea
    id: language
    attributes:
      label: Original language and translated terminology
  - type: textarea
    id: rights
    attributes:
      label: Licence, rights, and redistribution information
      description: A public URL does not by itself permit redistribution.
  - type: textarea
    id: definitions
    attributes:
      label: Key definitions, limitations, or comparability concerns
