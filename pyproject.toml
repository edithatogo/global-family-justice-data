[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "global-family-justice-data"
version = "0.4.0a3"
description = "International family-justice source census, harmonisation pipeline and programme conductor"
readme = "README.md"
requires-python = ">=3.11"
license-files = ["LICENSE-NOTICE.md"]
authors = [
  {name = "Global Family Justice Data Project contributors"}
]
keywords = ["family justice", "court statistics", "open data", "comparative justice"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "jsonschema>=4.23,<5",
  "openpyxl>=3.1,<4",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "setuptools>=77,<81",
  "wheel>=0.45,<1",
  "hypothesis>=6,<7",
  "mypy>=1.13,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "pytest-timeout>=2,<3",
  "pytest-xdist>=3,<4",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23",
  "types-PyYAML>=6.0",
]
security = [
  "bandit>=1.8,<2",
  "pip-audit>=2.10,<3",
  "zizmor==1.27.0",
]

[project.scripts]
gfjd = "gfjd.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
testpaths = ["tests"]
timeout = 180
markers = [
  "unit: fast deterministic tests without complete product rehearsals",
  "integration: tests spanning repositories, products, release or resilience boundaries",
  "property: generative or property-based adversarial tests",
  "slow: tests intentionally permitted to exceed the ordinary unit-test budget",
]
filterwarnings = [
  "error",
]

[tool.coverage.run]
branch = true
source = ["gfjd"]
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 65
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
