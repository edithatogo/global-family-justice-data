name: v1 track epic
description: Create a release-level epic tied to a delivery track and gate
title: "[EPIC] "
labels: ["epic", "v1"]
body:
  - type: dropdown
    id: track
    attributes:
      label: Delivery track
      options:
        - T1 Governance and institutional home
        - T2 Scope, ontology, and methods
        - T3 Global jurisdiction and source census
        - T4 Acquisition, preservation, and provenance
        - T5 Extraction, harmonisation, and outcomes evidence
        - T6 Scientific and data quality assurance
        - T7 Engineering, architecture, and reproducibility
        - T8 Security, privacy, legal, and ethics
        - T9 Product, documentation, and accessibility
        - T10 Languages, partnerships, and community
        - T11 Operations, releases, support, and resilience
        - T12 Sustainability and impact evaluation
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Target stage
      options:
        - A Foundations / v0.2
        - B Controlled pilot / v0.3
        - C Integrated alpha / v0.4-v0.5
        - D Global public beta / v0.6-v0.7
        - E Feature freeze and hardening / v0.8
        - F Release candidate / v0.9-rc
        - G Stable v1.0
        - H v1.0.x maintenance
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome and problem
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-scope
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and risks
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: State objective tests and required release-gate evidence.
    validations:
      required: true
  - type: textarea
    id: review
    attributes:
      label: Accountable owner and independent reviewer
    validations:
      required: true
