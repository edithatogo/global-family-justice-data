name: Scheduled security audit

on:
  schedule:
    - cron: '43 4 * * 3'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_DEFAULT_INDEX: https://pypi.org/simple

jobs:
  audit:
    name: Dependency, code and workflow security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out immutable revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Provision Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Provision reviewed uv toolchain
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.10.0'
          enable-cache: true
          cache-dependency-glob: uv.lock
          download-from-astral-mirror: false
      - name: Synchronize locked security environment
        run: uv sync --frozen --extra dev --extra security
      - name: Export locked audit requirements
        run: uv export --frozen --all-extras --format requirements-txt --no-emit-project --output-file build/pip-audit-requirements.txt
      - name: Audit locked dependencies for known vulnerabilities
        run: uv run pip-audit --strict -r build/pip-audit-requirements.txt --progress-spinner off --format json --output build/pip-audit.json
      - name: Run Bandit
        run: uv run bandit -r src/gfjd -ll -f json -o build/bandit.json
      - name: Audit GitHub Actions with zizmor
        run: uv run zizmor --offline --pedantic --min-severity medium --format sarif .github > build/zizmor.sarif
      - name: Hash security receipts
        run: python -c 'import hashlib,pathlib; files=[pathlib.Path("build/pip-audit.json"),pathlib.Path("build/bandit.json"),pathlib.Path("build/zizmor.sarif")]; pathlib.Path("build/security-receipts.sha256").write_text("".join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p}\n" for p in files), encoding="utf-8")'
      - name: Upload security receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scheduled-security-audit
          path: |
            build/pip-audit.json
            build/bandit.json
            build/zizmor.sarif
            build/security-receipts.sha256
          if-no-files-found: error
          retention-days: 30
